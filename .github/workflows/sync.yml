name: Sync App Store data

# Vercel Hobby allows only ONE cron run per day, so the daily job in vercel.json
# fires at 06:00 UTC. This free GitHub Actions schedule fills the gaps: it hits the
# same /api/cron endpoint every 6 hours. ASC data still only advances once Apple
# publishes a new day (~24-48h lag), but the extra runs catch that publication
# sooner and keep near-real-time AdMob revenue fresh. The collection is idempotent
# (append-only, dedup on write), so overlapping with the Vercel cron is harmless.
#
# Setup (one-time): add a repo secret CRON_SECRET matching the Vercel env var.
#   gh secret set CRON_SECRET --repo lawoflarge/appstore-command-center
# Optional: override the target with a SITE_URL repo variable (defaults to prod).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: appstore-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collection
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://appstore-command-center.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          # /api/cron is idempotent (append-only, dedup-on-write), so retrying is safe.
          # Apple's ASC API and the GitHub data-repo writes occasionally hiccup (transient
          # 5xx / rate-limit) or push a single run past Vercel's 60s cap (504). A few spaced
          # retries turn those transient reds green; a real outage still fails after all of
          # them, so genuine problems are not masked.
          attempts=4
          code=000
          for i in $(seq 1 "$attempts"); do
            code=$(curl -sS --max-time 90 -o /tmp/out.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron" || echo 000)
            echo "Attempt $i/$attempts -> HTTP $code"
            cat /tmp/out.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep $((i * 30))
            fi
          done
          echo "::error::collection failed after $attempts attempts (last HTTP $code)"
          exit 1
